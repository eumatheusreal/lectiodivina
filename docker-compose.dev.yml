services:
  dev-cert-init:
    build:
      context: .
      dockerfile: docker/dev-cert-init/Dockerfile
    environment:
      CERT_DIR: /certs
      DOMAIN: localhost
    volumes:
      - certs-dev:/certs

  reverse-proxy-dev:
    image: nginx:1.27.5-alpine
    depends_on:
      dev-cert-init:
        condition: service_completed_successfully
      frontend:
        condition: service_started
      backend:
        condition: service_started
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./docker/nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
      - certs-dev:/etc/nginx/certs:ro

  frontend:
    image: node:22.15.1-alpine
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    expose: ["3000"]
    environment: ["NEXT_PUBLIC_API_URL=https://localhost/api"]

  backend:
    image: node:22.15.1-alpine
    working_dir: /app
    command: sh -c "npm install && npm run start:dev"
    volumes:
      - ./backend:/app
      - backend-node-modules:/app/node_modules
    expose: ["4000"]
    environment:
      DATABASE_URL: ${DATABASE_URL}
      CORS_ORIGIN: https://localhost

  mysql:
    image: mysql:8.4.5
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes: ["mysql-data:/var/lib/mysql"]
    ports: ["3306:3306"]

volumes:
  mysql-data:
  certs-dev:
  frontend-node-modules:
  backend-node-modules:
