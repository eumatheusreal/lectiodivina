services:
  reverse-proxy:
    image: nginx:1.27.5-alpine
    ports: ["80:80", "443:443"]
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - certbot-www:/var/www/certbot
      - certbot-conf:/etc/letsencrypt
    depends_on: [frontend, backend]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    expose: ["3000"]

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose: ["4000"]
    environment:
      NODE_ENV: production
      DATABASE_URL: ${DATABASE_URL}

  mysql:
    image: mysql:8.4.5
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes: ["mysql-data:/var/lib/mysql"]

  certbot-init:
    image: certbot/certbot:v3.1.0
    command: sh -c 'test -d /etc/letsencrypt/live/${DOMAIN} || certbot certonly --webroot -w /var/www/certbot -d ${DOMAIN} --email ${LETSENCRYPT_EMAIL} --agree-tos --non-interactive ${LETSENCRYPT_STAGING:+--staging}'
    volumes: ["certbot-www:/var/www/certbot", "certbot-conf:/etc/letsencrypt"]

  certbot-renew:
    image: certbot/certbot:v3.1.0
    command: renew
    volumes: ["certbot-www:/var/www/certbot", "certbot-conf:/etc/letsencrypt"]

volumes:
  mysql-data:
  certbot-www:
  certbot-conf:
